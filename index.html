  var DATA = JSON.parse(dataEl.textContent);
  var grid = document.getElementById('grid');
  var qInput = document.getElementById('q');
  var chipsBox = document.getElementById('chips');
  var htmlOnly = document.getElementById('htmlOnly');
  var sortSel = document.getElementById('sort');
  var resultEl = document.getElementById('result');
  var clearBtn = document.getElementById('clearFilters');
  var emptyBox = document.getElementById('empty');
  var emptyClear = document.getElementById('emptyClear');
  var state = { q: '', cat: '', htmlOnly: false, sort: 'date' };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(s) { return String(s || '').toLocaleLowerCase('zh-CN'); }
  function encPath(rel) {
    return String(rel).split('/').map(function (seg) { return encodeURIComponent(seg); }).join('/');
  }

  function catStats() {
    var map = {};
    DATA.forEach(function (p) { map[p.c] = (map[p.c] || 0) + 1; });
    return Object.keys(map)
      .map(function (name) { return { name: name, count: map[name] }; })
      .sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name, 'zh-Hans-CN'); });
  }

  function matches(p) {
    if (state.cat && p.c !== state.cat) return false;
    if (state.htmlOnly && !p.h) return false;
    if (state.q) {
      var terms = norm(state.q).split(/\s+/).filter(Boolean);
      var hay = norm([p.t, p.c, p.g, (p.tags || []).join(' ')].join(' '));
      for (var i = 0; i < terms.length; i += 1) {
        if (hay.indexOf(terms[i]) === -1) return false;
      }
    }
    return true;
  }

  function sorted(list) {
    var arr = list.slice();
    if (state.sort === 'category') {
      arr.sort(function (a, b) { return a.c.localeCompare(b.c, 'zh-Hans-CN') || (b.d || '').localeCompare(a.d || ''); });
    } else if (state.sort === 'title') {
      arr.sort(function (a, b) { return a.t.localeCompare(b.t, 'zh-Hans-CN'); });
    } else {
      arr.sort(function (a, b) { return (b.d || '').localeCompare(a.d || '') || a.c.localeCompare(b.c, 'zh-Hans-CN') || a.t.localeCompare(b.t, 'zh-Hans-CN'); });
    }
    return arr;
  }

  function cardHtml(p) {
    var mdLink = 'md.html?p=' + encPath(p.rel);
    var tagline = p.g ? '<p class="tagline">' + esc(p.g) + '</p>' : '';
    var tags = (p.tags || []).slice(0, 5).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var htmlBtn = p.h ? '<a class="btn" href="' + encPath(p.hr) + '">阅读页 →</a>' : '';
    return '<article class="card">' +
      '<div class="card-head"><span class="date">' + esc(p.d) + '</span><span class="chip">' + esc(p.c) + '</span></div>' +
      '<h2><a class="title-link" href="' + mdLink + '">' + esc(p.t) + '</a></h2>' +
      tagline +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      '<div class="actions">' + htmlBtn + '</div>' +
      '</article>';
  }

  function renderChips() {
    var stats = catStats();
    var html = '<button type="button" class="filter-chip" data-cat="" aria-pressed="true">全部<span class="chip-n">' + DATA.length + '</span></button>';
    stats.forEach(function (s) {
      html += '<button type="button" class="filter-chip" data-cat="' + esc(s.name) + '" aria-pressed="false">' + esc(s.name) + '<span class="chip-n">' + s.count + '</span></button>';
    });
    chipsBox.innerHTML = html;
  }

  function readHash() {
    try {
      var h = new URLSearchParams(window.location.hash.slice(1));
      state.q = h.get('q') || '';
      state.cat = h.get('cat') || '';
      state.htmlOnly = h.get('html') === '1';
      var s = h.get('sort');
      state.sort = (s === 'category' || s === 'title') ? s : 'date';
    } catch (e) { /* 非法 hash 时忽略 */ }
  }

  function writeHash() {
    try {
      var h = new URLSearchParams();
      if (state.q) h.set('q', state.q);
      if (state.cat) h.set('cat', state.cat);
      if (state.htmlOnly) h.set('html', '1');
      if (state.sort !== 'date') h.set('sort', state.sort);
      var s = h.toString();
      history.replaceState(null, '', s ? '#' + s : window.location.pathname + window.location.search);
    } catch (e) { /* file:// 等环境下忽略 */ }
  }

  function apply() {
    var list = sorted(DATA.filter(matches));
    grid.innerHTML = list.map(cardHtml).join('');
    var active = !!(state.q || state.cat || state.htmlOnly);
    resultEl.innerHTML = active
      ? '显示 <b>' + list.length + '</b> / ' + DATA.length + ' 条'
      : '共 <b>' + DATA.length + '</b> 条';
    clearBtn.hidden = !active;
    emptyBox.hidden = list.length !== 0;
    grid.hidden = list.length === 0;
    if (qInput.value !== state.q) qInput.value = state.q;
    if (sortSel.value !== state.sort) sortSel.value = state.sort;
    if (htmlOnly.checked !== state.htmlOnly) htmlOnly.checked = state.htmlOnly;
    var chips = chipsBox.querySelectorAll('.filter-chip');
    for (var i = 0; i < chips.length; i += 1) {
      chips[i].setAttribute('aria-pressed', String(chips[i].getAttribute('data-cat') === state.cat));
    }
    writeHash();
  }

  qInput.addEventListener('input', function () {
    state.q = qInput.value;
    apply();
  });
  chipsBox.addEventListener('click', function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest('.filter-chip') : null;
    if (!btn) return;
    state.cat = btn.getAttribute('data-cat') || '';
    apply();
  });
  htmlOnly.addEventListener('change', function () {
    state.htmlOnly = htmlOnly.checked;
    apply();
  });
  sortSel.addEventListener('change', function () {
    state.sort = sortSel.value;
    apply();
  });
  clearBtn.addEventListener('click', function () {
    state.q = '';
    state.cat = '';
    state.htmlOnly = false;
    apply();
    qInput.focus();
  });
  emptyClear.addEventListener('click', function () {
    state.q = '';
    state.cat = '';
    state.htmlOnly = false;
    apply();
    qInput.focus();
  });
  document.addEventListener('keydown', function (ev) {
    var tag = document.activeElement ? document.activeElement.tagName : '';
    if (ev.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
      ev.preventDefault();
      qInput.focus();
    } else if (ev.key === 'Escape' && document.activeElement === qInput) {
      state.q = '';
      qInput.value = '';
      apply();
      qInput.blur();
    }
  });

  renderChips();
  readHash();
  apply();
})();
</script>
</body>
</html>
