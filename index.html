<script id="tag-vocab" type="application/json">[{"id":"direction","name":"应用方向","tags":["编码开发","Agent 研发","模型与训练","提示与上下文","知识管理与检索","内容生产","数据与分析","自动化与集成","个人效率","团队与组织","求职与成长","安全与合规","设计与人机交互"]},{"id":"concept","name":"核心概念","tags":["Agent","多智能体","Agent 编排","Agent Skills","MCP","RAG","提示工程","上下文工程","大模型","编码智能体"]}]</script>
<script>
(function () {
  'use strict';
  var dataEl = document.getElementById('archive-data');
  if (!dataEl) return;
  var DATA = JSON.parse(dataEl.textContent);
  var grid = document.getElementById('grid');
  var qInput = document.getElementById('q');
  var chipsBox = document.getElementById('chips');
  var htmlOnly = document.getElementById('htmlOnly');
  var sortSel = document.getElementById('sort');
  var resultEl = document.getElementById('result');
  var clearBtn = document.getElementById('clearFilters');
  var emptyBox = document.getElementById('empty');
  var emptyClear = document.getElementById('emptyClear');
  var tagChipsBoxes = document.querySelectorAll('.chips[data-dim]');
  var tagModeBox = document.getElementById('tagMode');
  var tagModeHint = document.getElementById('tagModeHint');
  var emptyHint = document.getElementById('emptyHint');
  var emptyRelax = document.getElementById('emptyRelax');
  var TAG_DIMS = (function () {
    var el = document.getElementById('tag-vocab');
    if (!el) return [];
    try { return JSON.parse(el.textContent) || []; } catch (e) { return []; }
  })();
  var TAG_DIM_OF = {};
  var TAG_ORDER = {};
  TAG_DIMS.forEach(function (dim) {
    (dim.tags || []).forEach(function (name, i) {
      TAG_DIM_OF[norm(name)] = dim.id;
      TAG_ORDER[norm(name)] = i;
    });
  });
  var state = { q: '', cat: '', tags: [], tagMode: 'and', htmlOnly: false, sort: 'date' };

  function sameTag(a, b) { return norm(a) === norm(b); }
  function isTagOn(name) {
    for (var i = 0; i < state.tags.length; i += 1) { if (sameTag(state.tags[i], name)) return true; }
    return false;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(s) { return String(s || '').toLocaleLowerCase('zh-CN'); }
  function encPath(rel) {
    return String(rel).split('/').map(function (seg) { return encodeURIComponent(seg); }).join('/');
  }

  function catStats() {
    var map = {};
    DATA.forEach(function (p) { map[p.c] = (map[p.c] || 0) + 1; });
    return Object.keys(map)
      .map(function (name) { return { name: name, count: map[name] }; })
      .sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name, 'zh-Hans-CN'); });
  }

  function matches(p) {
    if (state.cat && p.c !== state.cat) return false;
    if (state.htmlOnly && !p.h) return false;
    if (state.tags.length) {
      var pTags = (p.tags || []).map(norm);
      if (state.tagMode === 'or') {
        var hitAny = false;
        for (var j = 0; j < state.tags.length; j += 1) {
          if (pTags.indexOf(norm(state.tags[j])) !== -1) { hitAny = true; break; }
        }
        if (!hitAny) return false;
      } else {
        for (var k = 0; k < state.tags.length; k += 1) {
          if (pTags.indexOf(norm(state.tags[k])) === -1) return false;
        }
      }
    }
    if (state.q) {
      var terms = norm(state.q).split(/\s+/).filter(Boolean);
      var hay = norm([p.t, p.c, p.g, (p.tags || []).join(' ')].join(' '));
      for (var i = 0; i < terms.length; i += 1) {
        if (hay.indexOf(terms[i]) === -1) return false;
      }
    }
    return true;
  }

  function sorted(list) {
    var arr = list.slice();
    if (state.sort === 'category') {
      arr.sort(function (a, b) { return a.c.localeCompare(b.c, 'zh-Hans-CN') || (b.d || '').localeCompare(a.d || ''); });
    } else if (state.sort === 'title') {
      arr.sort(function (a, b) { return a.t.localeCompare(b.t, 'zh-Hans-CN'); });
    } else {
      arr.sort(function (a, b) { return (b.d || '').localeCompare(a.d || '') || a.c.localeCompare(b.c, 'zh-Hans-CN') || a.t.localeCompare(b.t, 'zh-Hans-CN'); });
    }
    return arr;
  }

  function cardHtml(p) {
    var mdLink = 'md.html?p=' + encPath(p.rel);
    var tagline = p.g ? '<p class="tagline">' + esc(p.g) + '</p>' : '';
    var tags = (p.tags || []).slice(0, 5).map(function (t) {
      var on = isTagOn(t);
      return '<button type="button" class="tag" data-tag="' + esc(t) + '" aria-pressed="' + on + '" title="按「' + esc(t) + '」筛选">' + esc(t) + '</button>';
    }).join('');
    var htmlBtn = p.h ? '<a class="btn" href="' + encPath(p.hr) + '">阅读页 →</a>' : '';
    return '<article class="card">' +
      '<div class="card-head"><span class="date">' + esc(p.d) + '</span><span class="chip">' + esc(p.c) + '</span></div>' +
      '<h2><a class="title-link" href="' + mdLink + '">' + esc(p.t) + '</a></h2>' +
      tagline +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      '<div class="actions">' + htmlBtn + '</div>' +
      '</article>';
  }

  function renderChips() {
    var stats = catStats();
    var html = '<button type="button" class="filter-chip" data-cat="" aria-pressed="true">全部<span class="chip-n">' + DATA.length + '</span></button>';
    stats.forEach(function (s) {
      html += '<button type="button" class="filter-chip" data-cat="' + esc(s.name) + '" aria-pressed="false">' + esc(s.name) + '<span class="chip-n">' + s.count + '</span></button>';
    });
    chipsBox.innerHTML = html;
  }

  function tagStatsFor(dimId) {
    var map = {};
    DATA.forEach(function (p) {
      (p.tags || []).forEach(function (t) {
        if ((TAG_DIM_OF[norm(t)] || 'tag') === dimId) map[t] = (map[t] || 0) + 1;
      });
    });
    return Object.keys(map)
      .map(function (name) { return { name: name, count: map[name], order: TAG_ORDER[norm(name)] }; })
      .sort(function (a, b) {
        var ao = a.order === undefined ? 9999 : a.order;
        var bo = b.order === undefined ? 9999 : b.order;
        return ao - bo || b.count - a.count;
      });
  }

  function renderTagChips() {
    for (var bi = 0; bi < tagChipsBoxes.length; bi += 1) {
      var box = tagChipsBoxes[bi];
      var stats = tagStatsFor(box.getAttribute('data-dim'));
      var sig = stats.map(function (s) { return s.name; }).join('␀');
      if (box.getAttribute('data-sig') === sig) {
        // 只是选中态变化时原地更新，避免整块重绘导致键盘焦点丢失
        var nodes = box.querySelectorAll('.tag-chip');
        for (var i = 0; i < nodes.length; i += 1) {
          nodes[i].setAttribute('aria-pressed', String(isTagOn(nodes[i].getAttribute('data-tag'))));
        }
        continue;
      }
      box.setAttribute('data-sig', sig);
      box.innerHTML = stats.map(function (s) {
        return '<button type="button" class="filter-chip tag-chip" data-tag="' + esc(s.name) +
          '" aria-pressed="' + isTagOn(s.name) + '">' + esc(s.name) +
          '<span class="chip-n">' + s.count + '</span></button>';
      }).join('');
    }
    var multi = state.tags.length >= 2;
    tagModeBox.hidden = !multi;
    tagModeHint.hidden = multi;
    var modeBtns = tagModeBox.querySelectorAll('button');
    for (var mi = 0; mi < modeBtns.length; mi += 1) {
      modeBtns[mi].setAttribute('aria-pressed', String(modeBtns[mi].getAttribute('data-mode') === state.tagMode));
    }
  }

  function toggleTag(name) {
    var idx = -1;
    for (var i = 0; i < state.tags.length; i += 1) { if (sameTag(state.tags[i], name)) { idx = i; break; } }
    if (idx === -1) state.tags.push(name);
    else state.tags.splice(idx, 1);
    if (state.tags.length < 2) state.tagMode = 'and';
    apply();
  }

  function resetFilters() {
    state.q = '';
    state.cat = '';
    state.tags = [];
    state.tagMode = 'and';
    state.htmlOnly = false;
    apply();
    qInput.focus();
  }

  function readHash() {
    try {
      var h = new URLSearchParams(window.location.hash.slice(1));
      state.q = h.get('q') || '';
      state.cat = h.get('cat') || '';
      state.tags = (h.get('tags') || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
      state.tagMode = h.get('tm') === 'or' ? 'or' : 'and';
      state.htmlOnly = h.get('html') === '1';
      var s = h.get('sort');
      state.sort = (s === 'category' || s === 'title') ? s : 'date';
    } catch (e) { /* 非法 hash 时忽略 */ }
  }

  function writeHash() {
    try {
      var h = new URLSearchParams();
      if (state.q) h.set('q', state.q);
      if (state.cat) h.set('cat', state.cat);
      if (state.tags.length) h.set('tags', state.tags.join(','));
      if (state.tags.length > 1 && state.tagMode === 'or') h.set('tm', 'or');
      if (state.htmlOnly) h.set('html', '1');
      if (state.sort !== 'date') h.set('sort', state.sort);
      var s = h.toString();
      history.replaceState(null, '', s ? '#' + s : window.location.pathname + window.location.search);
    } catch (e) { /* file:// 等环境下忽略 */ }
  }

  function apply() {
    var list = sorted(DATA.filter(matches));
    grid.innerHTML = list.map(cardHtml).join('');
    var active = !!(state.q || state.cat || state.tags.length || state.htmlOnly);
    var bits = [];
    if (state.cat) bits.push('分类「' + state.cat + '」');
    if (state.tags.length) bits.push('标签「' + state.tags.join(state.tagMode === 'or' ? ' 或 ' : ' 且 ') + '」');
    if (state.q) bits.push('搜索「' + state.q + '」');
    resultEl.innerHTML = active
      ? '显示 <b>' + list.length + '</b> / ' + DATA.length + ' 条 ｜ ' + esc(bits.join(' · '))
      : '共 <b>' + DATA.length + '</b> 条';
    clearBtn.hidden = !active;
    emptyBox.hidden = list.length !== 0;
    grid.hidden = list.length === 0;
    emptyRelax.hidden = !(list.length === 0 && state.tags.length >= 2 && state.tagMode === 'and');
    emptyHint.hidden = list.length !== 0 || !state.tags.length;
    if (list.length === 0 && state.tags.length) {
      emptyHint.textContent = state.tags.length >= 2
        ? '当前要求同时命中 ' + state.tags.length + ' 个标签，条件偏严。'
        : '这个标签下暂时没有条目，试试放宽其他条件。';
    }
    if (qInput.value !== state.q) qInput.value = state.q;
    if (sortSel.value !== state.sort) sortSel.value = state.sort;
    if (htmlOnly.checked !== state.htmlOnly) htmlOnly.checked = state.htmlOnly;
    var chips = chipsBox.querySelectorAll('.filter-chip');
    for (var i = 0; i < chips.length; i += 1) {
      chips[i].setAttribute('aria-pressed', String(chips[i].getAttribute('data-cat') === state.cat));
    }
    renderTagChips();
    writeHash();
  }

  qInput.addEventListener('input', function () {
    state.q = qInput.value;
    apply();
  });
  chipsBox.addEventListener('click', function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest('.filter-chip') : null;
    if (!btn) return;
    state.cat = btn.getAttribute('data-cat') || '';
    apply();
  });
  tagChipsBoxes.forEach(function (box) {
    box.addEventListener('click', function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest('.tag-chip') : null;
      if (!btn) return;
      toggleTag(btn.getAttribute('data-tag'));
    });
  });
  grid.addEventListener('click', function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest('button.tag') : null;
    if (!btn) return;
    toggleTag(btn.getAttribute('data-tag'));
  });
  tagModeBox.addEventListener('click', function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest('button[data-mode]') : null;
    if (!btn) return;
    state.tagMode = btn.getAttribute('data-mode') === 'or' ? 'or' : 'and';
    apply();
  });
  emptyRelax.addEventListener('click', function () {
    state.tagMode = 'or';
    apply();
  });
  htmlOnly.addEventListener('change', function () {
    state.htmlOnly = htmlOnly.checked;
    apply();
  });
  sortSel.addEventListener('change', function () {
    state.sort = sortSel.value;
    apply();
  });
  clearBtn.addEventListener('click', resetFilters);
  emptyClear.addEventListener('click', resetFilters);
  document.addEventListener('keydown', function (ev) {
    var tag = document.activeElement ? document.activeElement.tagName : '';
    if (ev.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
      ev.preventDefault();
      qInput.focus();
    } else if (ev.key === 'Escape' && document.activeElement === qInput) {
      state.q = '';
      qInput.value = '';
      apply();
      qInput.blur();
    }
  });

  renderChips();
  readHash();
  apply();
})();
</script>
</body>
</html>
